    "timezone": "Etc/UTC",
    "theme": "dark",

    "locale": "fr",
    "toolbar_bg": "#1e293b",
    "hide_top_toolbar": false,
    "allow_symbol_change": true
});

<html lang="fr">

<div class="container">
