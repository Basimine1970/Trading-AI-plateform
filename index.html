<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trading AI Plateforme</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">
    <h1>📈 Trading AI Plateforme</h1>

    <div class="card">
        <h2>Analyse du marché</h2>

        <p>Paire : EUR/USD</p>

        <button onclick="analyserMarche()">
            Analyser maintenant
        </button>

        <div id="resultat">
            <h3>Résultat</h3>
            <p>En attente...</p>
        </div>

        <div id="tradingview_chart" style="height:400px; margin-top:20px;"></div>

    </div>
</div>

<script src="https://s3.tradingview.com/tv.js"></script>

<script>
new TradingView.widget({
    container_id: "tradingview_chart",
    width: "100%",
    height: 400,
    symbol: "FX:EURUSD",
    interval: "1",
    timezone: "Etc/UTC",
    theme: "dark",
    style: "1",
    locale: "fr",
    toolbar_bg: "#1e293b",
    allow_symbol_change: true
});
</script>

<script src="analyse.js"></script>
<script src="script.js"></script>

</body>
</html>

</html>
