<!DOCTYPE html><html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"><title>TREU TRADING AI</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        background: #07111f;
        color: white;
        font-family: Arial, sans-serif;
    }

    .app {
        width: 100%;
        max-width: 480px;
        margin: auto;
        padding: 20px;
    }

    .header {
        text-align: center;
        padding: 20px 0;
    }

    .header h1 {
        margin: 0;
        font-size: 28px;
    }

    .header p {
        color: #94a3b8;
    }

    .card {
        background: #111c2d;
        border-radius: 18px;
        padding: 20px;
        margin-top: 15px;
    }

    label {
        display: block;
        margin-bottom: 8px;
        color: #cbd5e1;
    }

    select {
        width: 100%;
        padding: 14px;
        border-radius: 10px;
        background: #081221;
        color: white;
        border: 1px solid #334155;
        font-size: 16px;
    }

    button {
        width: 100%;
        margin-top: 18px;
        padding: 15px;
        border: none;
        border-radius: 10px;
        background: #2563eb;
        color: white;
        font-size: 17px;
        font-weight: bold;
        cursor: pointer;
    }

    button:disabled {
        opacity: 0.6;
        cursor: wait;
    }

    .status {
        margin-top: 20px;
    }

    .step {
        padding: 13px;
        margin: 8px 0;
        border-radius: 10px;
        background: #172337;
        text-align: center;
    }

    .working {
        background: #1e40af;
    }

    .finished {
        background: #166534;
    }

    .result {
        margin-top: 20px;
        padding: 20px;
        border-radius: 15px;
        background: #172337;
        text-align: center;
    }

    .result h2 {
        margin-top: 0;
    }

    .signal {
        font-size: 30px;
        font-weight: bold;
        margin: 15px 0;
    }

    .buy {
        color: #22c55e;
    }

    .sell {
        color: #ef4444;
    }

    .wait {
        color: #facc15;
    }

    .confidence {
        font-size: 21px;
        margin: 10px 0;
    }

    .info {
        color: #cbd5e1;
        line-height: 1.7;
    }

    .warning {
        margin-top: 20px;
        color: #64748b;
        font-size: 12px;
        text-align: center;
    }
</style>

</head><body><div class="app"><div class="header">
    <h1>🤖 TREU TRADING AI</h1>
    <p>AI-Powered Market Analysis</p>
</div>

<div class="card">

    <label for="pair">
        Choisir l'instrument
    </label>

    <select id="pair">
        <option value="EUR/USD OTC">EUR/USD OTC</option>
        <option value="GBP/USD OTC">GBP/USD OTC</option>
        <option value="USD/JPY OTC">USD/JPY OTC</option>
        <option value="AUD/USD OTC">AUD/USD OTC</option>
        <option value="XAU/USD">XAU/USD</option>
    </select>

    <button id="analyseBtn" onclick="lancerAnalyse()">
        🔍 ANALYSER LE MARCHÉ
    </button>

    <div id="status" class="status">
        <p style="text-align:center;">
            En attente de l'analyse...
        </p>
    </div>

    <div id="resultat"></div>

</div>

<div class="warning">
    ⚠️ Analyse expérimentale. Un signal ne garantit jamais un gain.
</div>

</div><!-- MOTEUR D'ANALYSE --><script src="analyse.js"></script><!-- MOTEUR DE SCORE --><script src="script.js"></script><script>

function lancerAnalyse() {

    const pair =
        document.getElementById("pair").value;

    const status =
        document.getElementById("status");

    const resultat =
        document.getElementById("resultat");

    const bouton =
        document.getElementById("analyseBtn");


    bouton.disabled = true;

    resultat.innerHTML = "";


    const etapes = [
        "S15 — Tendance",
        "S5 — Confirmation",
        "S3 — Signal rapide",
        "Fractal 2",
        "M1 — Contrôle"
    ];


    let html = `
        <h3 style="text-align:center;">
            📊 ANALYSE : ${pair}
        </h3>
    `;


    etapes.forEach(function(etape, index) {

        html += `
            <div
                class="step"
                id="step-${index}"
            >
                ⏳ ${etape} — EN ATTENTE
            </div>
        `;

    });


    status.innerHTML = html;


    let position = 0;


    const analyse =
        setInterval(function() {


            if (position > 0) {

                const precedent =
                    document.getElementById(
                        "step-" + (position - 1)
                    );

                precedent.classList.remove("working");

                precedent.classList.add("finished");

                precedent.innerHTML =
                    "✅ " +
                    etapes[position - 1] +
                    " — TERMINÉ";

            }


            if (position < etapes.length) {

                const actuel =
                    document.getElementById(
                        "step-" + position
                    );

                actuel.classList.add("working");

                actuel.innerHTML =
                    "⏳ " +
                    etapes[position] +
                    " — ANALYSE...";

                position++;

            }


            else {

                clearInterval(analyse);

                testerMoteur(pair);

                bouton.disabled = false;

            }


        }, 900);

}


/*
==========================================
TEST DU MOTEUR
==========================================
*/

function testerMoteur(pair) {

    const resultat =
        document.getElementById("resultat");


    /*
    Pour l'instant nous envoyons
    volontairement ATTENDRE.

    La prochaine étape sera de remplacer
    ces données de test par les vraies
    bougies du marché.
    */

    const signaux = {

        S3: "ATTENDRE",

        S5: "ATTENDRE",

        S15: "ATTENDRE",

        fractal: "ATTENDRE"

    };


    if (
        typeof analyserMultiTimeframe !==
        "function"
    ) {

        resultat.innerHTML = `

            <div class="result">

                <h2>⚠️ Moteur indisponible</h2>

                <p class="info">
                    Le moteur d'analyse n'a pas
                    été chargé correctement.
                </p>

            </div>

        `;

        return;
    }


    /*
    Le moteur de score existant attend
    actuellement des signaux S3/S5/S15.

    Cette partie sera reliée aux données
    réelles dans l'étape suivante.
    */

    const resultatIA =
        analyserMultiTimeframe(signaux);


    afficherResultat(
        pair,
        resultatIA
    );

}


/*
==========================================
AFFICHAGE DU RESULTAT
==========================================
*/

function afficherResultat(pair, data) {

    const resultat =
        document.getElementById("resultat");


    let classe = "wait";

    let titre = "⚪ ATTENDRE";


    if (data.signal === "ACHAT") {

        classe = "buy";

        titre = "🟢 ACHAT";

    }


    if (data.signal === "VENTE") {

        classe = "sell";

        titre = "🔴 VENTE";

    }


    resultat.innerHTML = `

        <div class="result">

            <h2>📊 Résultat IA</h2>

            <div class="signal ${classe}">
                ${titre}
            </div>

            <div class="confidence">
                Score :
                <strong>
                    ${data.score}/100
                </strong>
            </div>

            <div class="info">

                Instrument :
                ${pair}
                <br>

                Tendance :
                ${data.timeframe.tendance}
                <br>

                Confirmation :
                ${data.timeframe.confirmation}
                <br>

                Signal rapide :
                ${data.timeframe.rapide}
                <br>

                Fractal :
                ${data.fractal}

            </div>

        </div>

    `;

}

</script></body>
</html>
